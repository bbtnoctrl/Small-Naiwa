name: Linux 打包

# 推送到 main（改动了 Linux 版或本工作流）时自动构建，
# 也可以在 Actions 页面手动运行（Run workflow）。
on:
  push:
    branches: [main]
    paths:
      - "Linux版/**"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 numpy pyinstaller

      - name: PyInstaller 打单文件
        working-directory: Linux版
        run: |
          pyinstaller --noconfirm --clean --onefile --name xiaohuang 小黄桌宠.py
          ls -lh dist/

      - name: 打成可直接双击的 AppImage
        id: appimage
        continue-on-error: true
        run: |
          set -e
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp Linux版/dist/xiaohuang AppDir/usr/bin/xiaohuang
          cp 素材.nwp AppDir/usr/bin/素材.nwp
          cp 使用说明.txt AppDir/usr/bin/使用说明.txt
          if [ -f 形象/形象_245x312.png ]; then
            cp 形象/形象_245x312.png AppDir/usr/share/icons/hicolor/256x256/apps/xiaohuang.png
            cp 形象/形象_245x312.png AppDir/xiaohuang.png
          fi
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/xiaohuang" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/xiaohuang.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=XiaoHuang Desktop Pet
          Name[zh_CN]=小黄桌宠
          Comment=A small desktop pet that blinks, tracks your cursor and pokes its belly
          Exec=xiaohuang
          Icon=xiaohuang
          Categories=Game;Amusement;
          Terminal=false
          EOF
          chmod +x AppDir/xiaohuang.desktop
          curl -sL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir 小黄桌宠-x86_64.AppImage
          ls -lh *.AppImage

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xiaohuang-linux-x86_64
          path: |
            Linux版/dist/xiaohuang
            小黄桌宠-x86_64.AppImage
          if-no-files-found: warn

      - name: 发布到 Release（仅在打 tag/release 时）
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Linux版/dist/xiaohuang
            素材.nwp
            小黄桌宠-x86_64.AppImage
          fail_on_unmatched_files: false

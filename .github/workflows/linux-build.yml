name: Linux 打包

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Linux版/**"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 numpy pyinstaller

      - name: PyInstaller 打单文件
        working-directory: Linux版
        run: |
          pyinstaller --noconfirm --clean --onefile --name xiaohuang 小黄桌宠.py
          ls -lh dist/

      - name: 打成 AppImage
        continue-on-error: true
        run: |
          set -e
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp Linux版/dist/xiaohuang AppDir/usr/bin/xiaohuang
          cp 素材.nwp AppDir/usr/bin/素材.nwp
          cp 素材.nwp AppDir/usr/bin/assets.nwp
          cp 使用说明.txt AppDir/usr/bin/使用说明.txt
          if [ -f 形象/形象_245x312.png ]; then
            cp 形象/形象_245x312.png AppDir/usr/share/icons/hicolor/256x256/apps/xiaohuang.png
            cp 形象/形象_245x312.png AppDir/xiaohuang.png
          fi
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/xiaohuang" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=XiaoHuang Desktop Pet' 'Name[zh_CN]=小黄桌宠' 'Exec=xiaohuang' 'Icon=xiaohuang' 'Categories=Game;Amusement;' 'Terminal=false' > AppDir/xiaohuang.desktop
          chmod +x AppDir/xiaohuang.desktop
          curl -sL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir xiaohuang-x86_64.AppImage
          ls -lh *.AppImage

      - name: 生成 ASCII 素材别名
        run: cp 素材.nwp assets.nwp

      - name: 打包 tar.gz（解压后双击即可）
        run: |
          set -e
          mkdir -p pack
          if [ -f xiaohuang-x86_64.AppImage ]; then
            cp xiaohuang-x86_64.AppImage pack/xiaohuang.AppImage
            chmod +x pack/xiaohuang.AppImage
          fi
          cp 素材.nwp pack/素材.nwp
          cp 使用说明.txt pack/使用说明.txt
          printf '%s\n' \
            '小黄桌宠 · Linux 版' \
            '' \
            '【最省事：不用终端】' \
            '1. 把整个压缩包解压（右键 -> 解压到此处）' \
            '2. 双击 xiaohuang.AppImage' \
            '3. 若双击没反应：右键它 -> 属性 -> 权限 -> 勾选「允许作为程序执行」，关闭后再右键 -> 运行' \
            '' \
            '【提示 FUSE / libfuse.so.2 错误时】' \
            '   优先改用 .deb 安装包（双击安装）；' \
            '   或在终端执行：./xiaohuang.AppImage --appimage-extract-and-run' \
            '' \
            '【右键菜单】' \
            '   小黄身上右键：啄肚肚 / 停止 / 大小 / 置顶 / 全屏隐藏 / 回到右下角 / 退出' \
            > pack/使用说明-先看这个.txt
          tar -czf xiaohuang-linux-x86_64.tar.gz -C pack .
          ls -lh xiaohuang-linux-x86_64.tar.gz

      - name: 打包 .deb（双击安装，纯鼠标）
        continue-on-error: true
        run: |
          set -e
          rm -rf deb
          mkdir -p deb/DEBIAN deb/opt/xiaohuang deb/usr/bin
          mkdir -p deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps
          cp Linux版/dist/xiaohuang deb/opt/xiaohuang/xiaohuang
          cp 素材.nwp deb/opt/xiaohuang/素材.nwp
          cp 素材.nwp deb/opt/xiaohuang/assets.nwp
          cp 使用说明.txt deb/opt/xiaohuang/使用说明.txt
          if [ -f 形象/形象_245x312.png ]; then
            cp 形象/形象_245x312.png deb/usr/share/icons/hicolor/256x256/apps/xiaohuang.png
          fi
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=小黄桌宠' 'Name[en]=XiaoHuang Desktop Pet' 'Comment=会转眼、眨眼、戳肚子、双击啄肚肚的桌面宠物' 'Exec=/opt/xiaohuang/xiaohuang' 'Path=/opt/xiaohuang' 'Icon=xiaohuang' 'Terminal=false' 'Categories=Game;Amusement;' > deb/usr/share/applications/xiaohuang.desktop
          ln -sf /opt/xiaohuang/xiaohuang deb/usr/bin/xiaohuang
          printf '%s\n' 'Package: xiaohuang' 'Version: 1.3.0' 'Section: games' 'Priority: optional' 'Architecture: amd64' 'Maintainer: bbtnoctrl <299799212+bbtnoctrl@users.noreply.github.com>' 'Depends: libxcb-cursor0' 'Description: XiaoHuang Desktop Pet' ' A small desktop pet that blinks, tracks your cursor and pokes its belly.' > deb/DEBIAN/control
          chmod 755 deb/DEBIAN deb/opt/xiaohuang/xiaohuang
          chmod 644 deb/usr/share/applications/xiaohuang.desktop
          dpkg-deb --build --root-owner-group deb xiaohuang_1.3.0_amd64.deb
          ls -lh *.deb

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xiaohuang-linux-x86_64
          path: |
            Linux版/dist/xiaohuang
            xiaohuang-x86_64.AppImage
            xiaohuang-linux-x86_64.tar.gz
            xiaohuang_1.3.0_amd64.deb
          if-no-files-found: warn

      - name: 发布到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xiaohuang_1.3.0_amd64.deb
            xiaohuang-linux-x86_64.tar.gz
            xiaohuang-x86_64.AppImage
            Linux版/dist/xiaohuang
            assets.nwp
          fail_on_unmatched_files: false
          body: |
            ## Linux：三种装法，按省事程度排

            ### ① 纯鼠标：.deb 安装包（Ubuntu / Debian / 麒麟 / UOS 推荐）

            1. 下载 xiaohuang_1.3.0_amd64.deb
            2. 双击它 —— 会打开软件安装窗口
            3. 点「安装」（会弹一次密码框，输入开机密码）
            4. 应用菜单里搜「小黄」，点开即用

            装好后会出现在应用菜单，可右键「添加到收藏夹」。卸载：软件中心点卸载即可。

            ### ② 免安装：解压后双击（任何发行版）

            1. 下载 xiaohuang-linux-x86_64.tar.gz
            2. 右键 → 解压到此处
            3. 双击解压出来的 xiaohuang.AppImage

            若双击没反应：右键 AppImage → 属性 → 权限 → 勾「允许此文件作为程序执行」→ 关闭 → 再右键 →「运行」。

            ### ③ 直接下 AppImage

            下载 xiaohuang-x86_64.AppImage → 在属性里勾选「允许作为程序执行」→ 双击。

            ### ④ 给要改代码的人

            下载 xiaohuang + assets.nwp 放同一目录运行；或 clone 仓库后在 Linux版/ 里执行 ./run.sh（依赖自动安装）。

            ### 常见问题

            | 现象 | 处理 |
            | --- | --- |
            | 双击 AppImage 没反应 | 属性 → 权限 → 勾「允许作为程序执行」，再右键「运行」 |
            | 提示 FUSE / libfuse.so.2 | 改用 .deb，或执行 ./xiaohuang.AppImage --appimage-extract-and-run |
            | 提示 libxcb-cursor 缺失 | .deb 已声明该依赖会自动装；手动：sudo apt install libxcb-cursor0 |

            ---

            ## Windows 用户

            在仓库首页下载 小黄桌宠.exe + 素材.nwp，放同一文件夹，双击 exe。

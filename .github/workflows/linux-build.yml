name: Linux 打包

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Linux版/**"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 numpy pyinstaller

      - name: PyInstaller 打单文件
        working-directory: Linux版
        run: |
          pyinstaller --noconfirm --clean --onefile --name xiaohuang 小黄桌宠.py
          ls -lh dist/

      - name: 打成 AppImage
        continue-on-error: true
        run: |
          set -e
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp Linux版/dist/xiaohuang AppDir/usr/bin/xiaohuang
          cp 素材.nwp AppDir/usr/bin/素材.nwp
          cp 素材.nwp AppDir/usr/bin/assets.nwp
          cp 使用说明.txt AppDir/usr/bin/使用说明.txt
          if [ -f 形象/形象_245x312.png ]; then
            cp 形象/形象_245x312.png AppDir/usr/share/icons/hicolor/256x256/apps/xiaohuang.png
            cp 形象/形象_245x312.png AppDir/xiaohuang.png
          fi
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/xiaohuang" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=XiaoHuang Desktop Pet' 'Name[zh_CN]=小黄桌宠' 'Exec=xiaohuang' 'Icon=xiaohuang' 'Categories=Game;Amusement;' 'Terminal=false' > AppDir/xiaohuang.desktop
          chmod +x AppDir/xiaohuang.desktop
          curl -sL -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir xiaohuang-x86_64.AppImage
          ls -lh *.AppImage

      - name: 生成 ASCII 素材别名
        run: cp 素材.nwp assets.nwp

      - name: 打包 tar.gz（解压后双击即可，免终端）
        run: |
          set -e
          mkdir -p pack
          if [ -f xiaohuang-x86_64.AppImage ]; then
            cp xiaohuang-x86_64.AppImage pack/xiaohuang.AppImage
            chmod +x pack/xiaohuang.AppImage
          fi
          cp 素材.nwp pack/素材.nwp
          cp 使用说明.txt pack/使用说明.txt
          printf '%s\n' \
            '小黄桌宠 · Linux 版' \
            '' \
            '【最省事：图形界面，不用开终端】' \
            '1. 先把整个压缩包解压（右键 → 解压到此处）' \
            '2. 双击 xiaohuang.AppImage 即可运行' \
            '3. 如果双击没反应：右键它 → 属性 → 权限 → 勾选“允许作为程序执行”，再双击' \
            '' \
            '【如果提示 FUSE 错误（容器/精简系统）】' \
            '   在终端里执行：./xiaohuang.AppImage --appimage-extract-and-run' \
            '' \
            '【右键菜单】' \
            '   小黄身上右键：啄肚肚 / 停止 / 大小 / 置顶 / 全屏隐藏 / 回到右下角 / 退出' \
            '' \
            '【素材】' \
            '   AppImage 已内置素材，不需要额外文件；' \
            '   如果用的是可执行文件 xiaohuang，则必须和 素材.nwp 放在同一目录' \
            > pack/使用说明-先看这个.txt
          tar -czf xiaohuang-linux-x86_64.tar.gz -C pack .
          ls -lh xiaohuang-linux-x86_64.tar.gz
          tar -tzf xiaohuang-linux-x86_64.tar.gz

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xiaohuang-linux-x86_64
          path: |
            Linux版/dist/xiaohuang
            xiaohuang-x86_64.AppImage
            xiaohuang-linux-x86_64.tar.gz
          if-no-files-found: warn

      - name: 发布到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xiaohuang-linux-x86_64.tar.gz
            xiaohuang-x86_64.AppImage
            Linux版/dist/xiaohuang
            assets.nwp
          fail_on_unmatched_files: false
          body: |
            ## Linux 用户：下载哪个？

            ### 方案一（推荐，双击就行，不用开终端）

            1. 下载 `xiaohuang-linux-x86_64.tar.gz`
            2. 右键 → 「**解压到此处**」
            3. 双击里面的 **`xiaohuang.AppImage`** —— 运行

            > 压缩包会把「可执行权限」一起解出来，所以解压后双击就能跑，不需要 `chmod`。
            > 如果双击没反应：右键 AppImage → 属性 → 权限 → 勾选「允许作为程序执行」，再双击。

            ### 方案二：直接下 AppImage（需要一次权限设置）

            | 步骤 | 操作 |
            | --- | --- |
            | 1 | 下载 `xiaohuang-x86_64.AppImage` |
            | 2 | 右键 → 属性 → 权限 → 勾选「允许作为程序执行」（或终端 `chmod +x 文件名`） |
            | 3 | 双击运行 |

            ### 方案三：可执行文件 + 素材

            下载 `xiaohuang` 和 `assets.nwp`，放在同一个文件夹，双击 `xiaohuang`（或运行 `./xiaohuang`）。

            提示 FUSE 错误时：`./xiaohuang.AppImage --appimage-extract-and-run`

            ---

            ## Windows 用户

            在本仓库首页下载 `小黄桌宠.exe` + `素材.nwp`，放同一文件夹，双击 exe。

            ## 从源码运行（给要改代码的人）

            `git clone` 后在 `Linux版/` 里执行 `./run.sh`，依赖会自动安装。
